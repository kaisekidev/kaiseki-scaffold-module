# Dependabot config — keeps dev tooling (phpstan, php-cs-fixer, ...) and GitHub
# Actions up to date so the 8.4 baseline doesn't drift. Dev deps AND all GitHub
# Actions are each grouped into a single weekly PR to cut noise; production
# (runtime) deps get individual PRs.

version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
