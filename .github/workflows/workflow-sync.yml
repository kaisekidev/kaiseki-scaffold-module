# Fails if the caller workflows this scaffold emits into generated modules
# (templates/shared/.github/workflows/*.yml) drift from the canonical org
# starter workflows in kaisekidev/.github (workflow-templates/*.yml).
#
# The starters are the source of truth; this repo only keeps a synced copy so
# the scaffold works offline. See README "Org-wide baselines".

name: Workflow sync

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diff emitted callers against canonical starters
        run: ./bin/check-workflow-sync.sh
