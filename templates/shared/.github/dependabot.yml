# Dependabot config — keeps dev tooling (phpstan, php-cs-fixer, phpunit, ...)
# and GitHub Actions up to date so the 8.4 baseline doesn't drift. Dev deps AND
# all GitHub Actions are each grouped into a single weekly PR to cut noise (an
# ungrouped config opens one PR per action per repo); production (runtime) deps
# get individual PRs because they affect downstream consumers and warrant review.
#
# NOTE: internal kaiseki/* deps are managed once they are on SemVer ranges
# (e.g. ^1.0 / ^2.0); while any are still `dev-master` Dependabot leaves them be.
#
# Production majors that don't build green yet are a deliberate per-package
# choice: add an `ignore:` entry under the composer ecosystem when needed.
#
# Labels use the org `area:*` taxonomy (see kaiseki-org contribution-style.md) —
# *where* the bump lands, never a kind/`dependencies` label: composer dev-tooling
# bumps are `area:tooling`, GitHub Actions bumps are `area:ci`. These labels must
# exist in the repo (seeded by kaiseki-org `apply-repo-labels`).

version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - area:tooling
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - area:ci
    groups:
      github-actions:
        patterns:
          - "*"
