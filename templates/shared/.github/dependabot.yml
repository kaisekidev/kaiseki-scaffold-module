# Dependabot config — keeps dev tooling (phpstan, php-cs-fixer, phpunit, ...)
# and GitHub Actions up to date so the 8.4 baseline doesn't drift. Dev deps are
# grouped into a single weekly PR; production (runtime) deps get individual PRs.
#
# NOTE: internal kaiseki/* deps are managed once they are on SemVer ranges
# (e.g. ^1.0 / ^2.0); while any are still `dev-master` Dependabot leaves them be.

version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
