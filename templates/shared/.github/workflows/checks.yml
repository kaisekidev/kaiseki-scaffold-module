# Thin caller that delegates to the shared reusable workflow in kaisekidev/.github.
# It runs check-deps / cs-check / phpstan (+ phpunit) across the 8.2/8.3/8.4 matrix.
#
# A freshly scaffolded module has no tests yet, so this defaults to static
# analysis only (`run-tests: false`) with NO `permissions:` block. Once you add
# real tests, remove the `with:` line below and add this block so the
# coverage-monitor can post its commit status (the reusable workflow declares
# `statuses: write` on every run, and a caller permissions block that omits it
# fails with a startup_failure):
#
#   permissions:
#     contents: read
#     pull-requests: write
#     statuses: write
#
# Set `coverage-threshold: <n>` in `with:` if coverage starts below 100%.

name: Checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    uses: kaisekidev/.github/.github/workflows/checks.yml@v1
    with:
      run-tests: false   # no tests yet; static analysis only
